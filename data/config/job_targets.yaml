        domain: "payments"

  tier_2:
    priority_tier: 2
    domain_group: "technology_product"
    reason: "High-scale product and technology engineering domain"
    bonus_points: 2.0
    companies:
      - name: "Zomato"
        domain: "consumer_tech"
