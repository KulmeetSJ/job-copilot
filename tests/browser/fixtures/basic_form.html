<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application - Standard</title>
</head>
<body>
    <h1>Job Application: Backend Engineer</h1>
    <form id="application-form" action="/submit" method="POST">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required autocomplete="given-name">

        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required autocomplete="family-name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">

        <label for="location">Current Location</label>
        <input type="text" id="location" name="location">

        <label for="linkedin">LinkedIn Profile URL</label>
        <input type="url" id="linkedin" name="linkedin">

        <label for="github">GitHub Profile URL</label>
        <input type="url" id="github" name="github">

        <label for="resume">Attach Resume (PDF)</label>
        <input type="file" id="resume" name="resume" accept=".pdf" required>

        <label for="cover_letter">Cover Letter</label>
        <textarea id="cover_letter" name="cover_letter" rows="6"></textarea>

        <button type="submit" id="submit-btn">Submit Application</button>
    </form>
</body>
</html>
