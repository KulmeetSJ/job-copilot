[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-copilot"
version = "0.1.0"
description = "Personal Job Application Automation and Copilot System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
job-copilot = "job_copilot.__main__:main"
job-copilot-api = "job_copilot.api.app:start_api"
job-copilot-mcp = "job_copilot.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
