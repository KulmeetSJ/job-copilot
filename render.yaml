# ==============================================================================
# Render Blueprint Specification for Job Copilot
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. API Web Service (Phase 9.4/9.5 Cloud Deployment)
  # ----------------------------------------------------------------------------
  - type: web
    name: job-copilot-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: HUMAN_CONFIRMATION_REQUIRED
        value: "true"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: job-copilot-postgres
          property: connectionString

  # ----------------------------------------------------------------------------
  # 2. Scheduled Periodic Copilot Execution (Cron Job - Reserved for Future Phase)
  # NOTE: In Phase 9.4/9.5, only the Web API service is active.
  # ----------------------------------------------------------------------------
  # - type: cron
  #   name: job-copilot-periodic-discovery
  #   runtime: docker
  #   dockerfilePath: Dockerfile
  #   schedule: "0 */3 * * *"   # Runs every 3 hours
  #   dockerCommand: "python -m job_copilot copilot-discover && python -m job_copilot copilot-process"
  #   envVars:
  #     - key: APP_ENV
  #       value: production
  #     - key: LOG_LEVEL
  #       value: INFO
  #     - key: LOG_FORMAT
  #       value: json
  #     - key: HUMAN_CONFIRMATION_REQUIRED
  #       value: "true"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: job-copilot-postgres
  #         property: connectionString

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Foundation (Phase 9.5)
# ------------------------------------------------------------------------------
databases:
  - name: job-copilot-postgres
    databaseName: job_copilot
    user: job_copilot_user
    plan: starter
    region: oregon

